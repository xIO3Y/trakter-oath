<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trakter — Trakt-aanmelding</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        max-width: 560px;
        margin: 70px auto;
        padding: 24px;
        line-height: 1.6;
        color: #222;
        background: #f7f7f7;
    }
    main {
        background: white;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
    }
    h1 {
        margin-top: 0;
    }
    button {
        padding: 12px 18px;
        border: 0;
        border-radius: 8px;
        background: #e65353;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:disabled {
        opacity: 0.5;
        cursor: default;
    }
    #status {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }
    .muted {
        color: #666;
        font-size: 14px;
    }
</style>
</head>
<body>
<main>
    <h1>Trakter</h1>
<p id="status">De aanmelding wordt gecontroleerd…</p>
<button id="openApp" hidden>
    Open Trakter
</button>
<p class="muted" id="fallback" hidden>
    Wordt Trakter niet automatisch geopend? Klik dan op de knop hierboven.
    Zorg ervoor dat Trakter geopend is op je Mac.
</p>
</main>
<script>
    const statusElement = document.getElementById("status");
    const openAppButton = document.getElementById("openApp");
    const fallbackElement = document.getElementById("fallback");
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    const error = params.get("error");
    let appURL = null;
    function openTrakter() {
        if (!appURL) {
            return;
        }
        window.location.href = appURL;
    }
    if (error) {
        statusElement.textContent =
            "Trakt heeft de aanmelding niet voltooid.\n\n" +
            "Melding: " + error +
            (params.get("error_description")
                ? "\n" + params.get("error_description")
                : "");
    } else if (code && state) {
        const callbackURL = new URL("trakter://oauth");
        callbackURL.searchParams.set("code", code);
        callbackURL.searchParams.set("state", state);
        appURL = callbackURL.toString();
        statusElement.textContent =
            "Aanmelding ontvangen. Trakter wordt geopend…";
        openAppButton.hidden = false;
        fallbackElement.hidden = false;
        openAppButton.addEventListener("click", openTrakter);
        // Geef de pagina even de tijd om de instructie te tonen.
        window.setTimeout(openTrakter, 700);
    } else {
        statusElement.textContent =
            "Er is geen volledige autorisatie ontvangen.\n\n" +
            "Controleer of je de aanmeldprocedure via Trakter hebt gestart. " +
            "Sluit deze pagina en probeer het opnieuw.";
    }
</script>
</body>
</html>
